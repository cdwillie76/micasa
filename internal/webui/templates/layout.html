<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}} - {{end}}micasa</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">micasa</a>
    <nav>
      <a href="/" {{if eq .Nav "dashboard"}}class="active"{{end}}>Dashboard</a>
      <a href="/house" {{if eq .Nav "house"}}class="active"{{end}}>House</a>
      <a href="/vendors" {{if eq .Nav "vendors"}}class="active"{{end}}>Vendors</a>
      <a href="/appliances" {{if eq .Nav "appliances"}}class="active"{{end}}>Appliances</a>
      <a href="/projects" {{if eq .Nav "projects"}}class="active"{{end}}>Projects</a>
      <a href="/incidents" {{if eq .Nav "incidents"}}class="active"{{end}}>Incidents</a>
      <a href="/maintenance" {{if eq .Nav "maintenance"}}class="active"{{end}}>Maintenance</a>
      <a href="/quotes" {{if eq .Nav "quotes"}}class="active"{{end}}>Quotes</a>
      <a href="/service-logs" {{if eq .Nav "service-logs"}}class="active"{{end}}>Service Logs</a>
      <a href="/documents" {{if eq .Nav "documents"}}class="active"{{end}}>Documents</a>
    </nav>
  </header>
  <main>
    {{template "content" .}}
  </main>
</body>
</html>
