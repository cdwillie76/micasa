<!doctype html>
<html lang="en">
<head>

  <title>{{if .Title}}{{.Title}} - {{end}}micasa</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <a class="brand" href="/">micasa</a>

    </nav>
  </header>
  <main>
    {{template "content" .}}
  </main>
</body>
</html>
